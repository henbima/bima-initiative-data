name: Periksa data satelit
on:
  schedule:
    - cron: '17 1 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monthly-land-cover
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baca inventaris dan siapkan pembaruan
        run: python update.py
      - name: Terbitkan hasil yang lolos pemeriksaan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bima Observatory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data || [ -n "$(git ls-files --others --exclude-standard data)" ]; then
            git add data
            git commit -m "Perbarui seri tutupan lahan yang tervalidasi"
          fi
          DATA_COMMIT=$(git log -1 --format=%H -- data)
          export DATA_COMMIT
          python -c "import datetime,json,os,pathlib; pathlib.Path('status.json').write_text(json.dumps(dict(dataCommit=os.environ['DATA_COMMIT'],checkedUtc=datetime.datetime.now(datetime.timezone.utc).isoformat()),indent=2)+'\n')"
          git add status.json
          git commit -m "Catat pemeriksaan arsip bulanan"
          git push origin HEAD:main
